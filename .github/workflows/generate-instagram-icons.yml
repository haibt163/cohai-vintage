name: Generate Instagram profile icon pack

on:
  push:
    branches:
      - feat/instagram-link-and-profile-icons
    paths:
      - "public/instagram.jpg"
      - "scripts/icons/generate-icons.py"
      - ".github/workflows/generate-instagram-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-icon-pack-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/feat/instagram-link-and-profile-icons'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branding branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate and validate icons
        run: python scripts/icons/generate-icons.py

      - name: Commit generated static assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/favicon.ico app/icon.svg app/apple-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png
          if git diff --cached --quiet; then
            echo "Icon assets already match the source image."
            exit 0
          fi
          git commit -m "chore: generate Instagram profile icon pack"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
